name: Run Amazon Organic Ranker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13,23 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create GCP Credentials File
        env:
          GCP_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_KEY" > gcp_key.json

      - name: Create Proxies File
        env:
          PROXIES_DATA: ${{ secrets.PROXIES_LIST }}
        run: |
          echo "$PROXIES_DATA" > proxies.txt

      - name: Run Ranker Script
        run: |
          python amazon_ranking.py

      - name: Cleanup Sensitive Data
        if: always()
        run: |
          rm -f gcp_key.json proxies.txt
