name: Amazon Keyword Rank Scraper

on:
  schedule:
    # Runs twice daily at 13:00 UTC (1:00 PM) and 23:00 UTC (11:00 PM)
    - cron: '0 23,13 * * *'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager beautifulsoup4 gspread google-auth

      - name: Run Amazon Ranker Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python amazon_ranking.py
