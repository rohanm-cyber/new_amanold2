name: Run Amazon Organic Ranker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13,23 * * *' # Optional: Har din run karne ke liye

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: |
          pip install selenium beautifulsoup4 gspread google-auth

      # SECRET SE TEMPORARY JSON FILE BANANA (FIXED FOR JSON ERROR)
      - name: Create GCP Credentials File
        run: |
          cat << 'EOF' > credentials.json
          ${{ secrets.GCP_SA_KEY }}
          EOF

      # PYTHON SCRIPT RUN KARNA
      - name: Run Ranker Script
        run: |
          python amazon_ranking.py

      # RUN HONE KE BAAD FILE DELETE KARNA (SECURITY)
      - name: Cleanup Credentials
        if: always()
        run: |
          rm -f gcp_key.json
