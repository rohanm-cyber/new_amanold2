name: Run Amazon Organic Ranker
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13,23 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    # CASE-SENSITIVE DUPLICATES REMOVED
    env:
      PROXY_SERVER_SECRET: ${{ secrets.PROXY_SERVER_SECRET }}
      HTTP_PROXY: ${{ secrets.PROXY_SERVER_SECRET }}
      HTTPS_PROXY: ${{ secrets.PROXY_SERVER_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup Xvfb (Virtual Display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create GCP Credentials File
        env:
          GCP_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_KEY" > gcp_key.json

      - name: Run Ranker Script
        env:
          PROXY_SERVER_SECRET: ${{ secrets.PROXY_SERVER_SECRET }}
          GCP_KEY_PATH: gcp_key.json
        run: |
          xvfb-run --auto-servernum python amazon_ranking.py

      - name: Cleanup Sensitive Data
        if: always()
        run: |
          rm -f gcp_key.json
