name: Amazon Ranker Daily Schedule

on:
  schedule:
    # IST 04:00 AM (22:30 UTC)
    - cron: '30 22 * * *'
    # IST 01:00 PM (07:30 UTC)
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  run-ranker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Service Account Credentials
        run: |
          cat << 'EOF' > G_CREDENTIAL.json
          ${{ secrets.GCP_SA_KEY }}
          EOF

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Amazon Ranker Script
        run: python amazon_ranking.py
